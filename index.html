<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./82280.png">
    <title>Hora de Costa Rica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="max-age=86400">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <container class="main-content">
        <section id="video-container">
            <video autoplay muted loop id="myVideo">
                <source src="./wallpapers/vdd(3).mp4" type="video/mp4">
            </video>
        </section>
        <section id="datetime-container">
            <p id="date" class="vidrio-esmerilado"></p>
            <time id="reloj" datetime="" class="vidrio-esmerilado">--:--:--</time>
            <div class="links">
                <a href="./utilities/calculator.html" class="link" target="_blank">Calculadora</a>
                <a href="./utilities/calendar.html" class="link" target="_blank">Calendario</a>
            </div>
            <div id="WallpaperLast" class="changeWallpaper"></div>
            <div id="wallpaperNext" class="changeWallpaper"></div>
        </section>

        <section id="wallpaper-selection">
        </section>

        <section id="debug-info">INFO</section>
    </container>

    <script src="./js/main.js" defer></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./82280.png">
    <title>Hora de Costa Rica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="max-age=86400">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <container class="main-content">
        <section id="video-container">
            <video autoplay muted loop id="myVideo">
                <source src="./wallpapers/vdd(3).mp4" type="video/mp4">
            </video>
        </section>
        <section id="datetime-container">
            <p id="date" class="vidrio-esmerilado"></p>
            <time id="reloj" datetime="" class="vidrio-esmerilado">--:--:--</time>
            <div id="WallpaperLast" class="changeWallpaper"></div>
            <div id="wallpaperNext" class="changeWallpaper"></div>
        </section>

        <section id="wallpaper-selection">
            <!-- grid with wallpaper options as images. Select one to choose and change the background. Images are on ./wallpapers/as image/ -->
            <img src="./wallpapers/as image/vdd(1).avif" alt="Wallpaper 1" class="wallpaper-option"
                data-wallpaper="vdd(2).mp4" onclick="changeWallpaper(this)">
            <img src="./wallpapers/as image/vdd(1).avif" alt="Wallpaper 2" class="wallpaper-option"
                data-wallpaper="vdd(1).mp4">
            <img src="./wallpapers/as image/vdd(1).avif" alt="Wallpaper 3" class="wallpaper-option"
                data-wallpaper="vdd(1).mp4">
            <img src="./wallpapers/as image/vdd(1).avif" alt="Wallpaper 4" class="wallpaper-option"
                data-wallpaper="vdd(1).mp4">
            <img src="./wallpapers/as image/vdd(1).avif" alt="Wallpaper 5" class="wallpaper-option"
                data-wallpaper="vdd(1).mp4">
            <img src="./wallpapers/as image/vdd(1).avif" alt="Wallpaper 6" class="wallpaper-option"
                data-wallpaper="vdd(1).mp4">
            <img src="./wallpapers/as image/vdd(1).avif" alt="Wallpaper 7" class="wallpaper-option"
                data-wallpaper="vdd(1).mp4">
        </section>

        <section id="debug-info">INFO</section>
    </container>

    <script src="./js/main.js" defer></script>

</body>

</html>

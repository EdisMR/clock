<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./82280.png">
    <title>Hora de Costa Rica</title>
    <meta http-equiv="Cache-Control" content="max-age=86400">

    <style>
        body,
        html {
            font-family: 'Segoe UI', Tahoma, Roboto, sans-serif;
            text-align: center;
            background-color: #181818;
            margin: 0;
            padding: 0;
        }

        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 70vh;
            user-select: none;
            user-drag: none;
            pointer-events: none;
        }

        #date {
            font-size: 70px;
            color: #ffffff;
            padding: 20px 60px;
            margin-bottom: 50px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.534);
        }

        #reloj {
            font-size: 150px;
            font-weight: bold;
            color: #dddddd;
            padding: 20px 60px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.473);
        }

        .vidrio-esmerilado {
            /* Color de fondo blanco con opacidad */
            background: rgba(66, 63, 63, 0.199);

            /* Efecto de desenfoque del fondo */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            /* Para soporte en Safari */

            /* Bordes suaves y redondeados */
            border-radius: 16px;

            /* Sombra para dar profundidad */
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* Style the video: 100% width and height to cover the entire window */
        #myVideo {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
        }

        /* Add some content at the bottom of the video/page */
        .content {
            background: rgba(0, 0, 0, 0.5);
            color: #f1f1f1;
            width: 100%;
            padding: 20px;
        }

        #changeWallpaper {
            position: fixed;
            bottom: 50px;
            right: 50px;
            background-color: rgba(57, 209, 27, 0);
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 200px;
            height: 100px;
            transition: all 0.2s ease-in-out;
        }

        #changeWallpaper:hover {
            background-color: rgba(58, 58, 58, 0.315);
            scale: 1.05;
        }

        #changeWallpaper:active {
            background-color: rgba(190, 190, 190, 0.76);
            scale: 0.95;
        }
    </style>
</head>

<body>
    <video autoplay muted loop id="myVideo">
        <source src="./wallpapers/a79b173d93_minecraft-coral-reef-live-wallpaper_x265.mp4" type="video/mp4">
    </video>

    <container class="content">
        <!-- Etiqueta semántica HTML para la hora -->
        <p id="date" class="vidrio-esmerilado"></p>
        <time id="reloj" datetime="" class="vidrio-esmerilado">--:--:--</time>
    </container>

    <div id="changeWallpaper"></div>

    <script>
        const TIMEZONE = "America/Costa_Rica";
        const DIAS_SEMANA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const elementoReloj = document.getElementById('reloj');
        const elementoFecha = document.getElementById('date');

        function obtenerFechaLocal() {
            return new Date(new Date().toLocaleString("en-US", { timeZone: TIMEZONE }));
        }

        function formatearHora(fecha) {
            const horas = String(fecha.getHours()).padStart(2, '0');
            const minutos = String(fecha.getMinutes()).padStart(2, '0');
            const segundos = String(fecha.getSeconds()).padStart(2, '0');
            return `${horas}:${minutos}:${segundos}`;
        }

        function formatearFecha(fecha) {
            const anio = fecha.getFullYear();
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            const dia = String(fecha.getDate()).padStart(2, '0');
            const diaSemana = DIAS_SEMANA[fecha.getDay()];
            return `${diaSemana}, ${anio}-${mes}-${dia}`;
        }

        function actualizar() {
            const ahora = obtenerFechaLocal();
            const horaTexto = formatearHora(ahora);
            const fechaTexto = formatearFecha(ahora);

            elementoReloj.textContent = horaTexto;
            elementoReloj.setAttribute('datetime', horaTexto);
            elementoFecha.textContent = fechaTexto;
        }

        actualizar();
        setInterval(actualizar, 1000);


        const wallpapers = [
            "23881-337972830_medium_x265.mp4",
            "14244-255658092_x265.mp4",
            "131973-751915246_x265.mp4",
            "178809-860734631_x265.mp4",
            "71122-537102350_x265.mp4",
            "a79b173d93_minecraft-coral-reef-live-wallpaper_x265.mp4"
        ]

        const changeWallpaperButton = document.getElementById('changeWallpaper');
        const videoElement = document.getElementById('myVideo');
        let currentWallpaper = localStorage.getItem('currentWallpaper') ? parseInt(localStorage.getItem('currentWallpaper')) : 0;
        videoElement.src = `./wallpapers/${wallpapers[currentWallpaper]}`;

        function changeWallpaper() {
            if (currentWallpaper < wallpapers.length - 1) {
                currentWallpaper++;
            } else {
                currentWallpaper = 0;
            }
            videoElement.src = `./wallpapers/${wallpapers[currentWallpaper]}`;

            localStorage.setItem('currentWallpaper', currentWallpaper);
        }
        changeWallpaperButton.addEventListener('click', changeWallpaper);
    </script>

</body>

</html>

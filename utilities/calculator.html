<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Material Design 3 - Dark Mode</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Roboto & Roboto Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Material Symbols Outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        mono: ['Roboto Mono', 'monospace'],
                    },
                    colors: {
                        md: {
                            bg: '#121212',
                            surface: '#1E1E1E',
                            surfaceVariant: '#28282D',
                            surfaceElevated: '#2C2C32',
                            primary: '#D0BCFF',
                            onPrimary: '#381E72',
                            secondaryContainer: '#4A4458',
                            onSecondaryContainer: '#E8DEF8',
                            tertiaryContainer: '#633B48',
                            onTertiaryContainer: '#FFD8E4',
                            textPrimary: '#E6E1E5',
                            textSecondary: '#CAC4D0',
                            outline: '#938F99'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Estilos base y variables Material Design 3 Dark */
        body {
            background-color: #121212;
            color: #E6E1E5;
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Efecto Ripple (Onda de Material Design) */
        .md-btn {
            position: relative;
            overflow: hidden;
            transition: background-color 0.2s cubic-bezier(0.2, 0, 0, 1), transform 0.1s ease;
        }

        .md-btn:active {
            transform: scale(0.96);
        }

        span.ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 550ms linear;
            background-color: rgba(255, 255, 255, 0.22);
            pointer-events: none;
        }

        .md-btn-primary span.ripple {
            background-color: rgba(56, 30, 114, 0.25);
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Personalización de la barra de desplazamiento (Scrollbar) */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #49454F;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6750A4;
        }

        /* Animación suave para el panel de historial en móvil */
        .history-drawer {
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), opacity 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-6 bg-md-bg">

    <!-- Contenedor Principal Responsivo -->
    <main class="w-full max-w-4xl bg-md-surface rounded-[28px] shadow-2xl border border-white/5 overflow-hidden flex flex-col md:flex-row relative min-h-[600px] max-h-[92vh]">
        
        <!-- Sección Izquierda / Principal: Calculadora -->
        <section class="flex-1 flex flex-col justify-between p-4 sm:p-6 z-10 bg-md-surface">
            
            <!-- Barra Superior (Header) -->
            <header class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2 text-md-textSecondary">
                    <span class="material-symbols-outlined text-md-primary text-xl">calculate</span>
                    <span class="text-sm font-medium tracking-wide">Calculadora</span>
                </div>
                
                <!-- Botón para abrir/cerrar historial en móviles -->
                <button id="toggleHistoryBtn" 
                        aria-label="Ver historial"
                        class="md:hidden md-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-md-surfaceVariant text-md-textSecondary hover:text-md-textPrimary text-xs font-medium">
                    <span class="material-symbols-outlined text-lg">history</span>
                    <span>Historial</span>
                </button>
            </header>

            <!-- Pantalla Dual (Display) -->
            <div class="bg-md-surfaceVariant/70 rounded-[24px] p-5 sm:p-6 mb-4 flex flex-col justify-end items-end min-h-[145px] sm:min-h-[165px] border border-white/5 relative overflow-hidden">
                <!-- Indicador de estado / error sutil -->
                <div id="statusBadge" class="absolute top-3 left-4 text-[11px] uppercase tracking-wider text-md-primary/80 font-medium opacity-0 transition-opacity duration-200">
                    Copiado
                </div>

                <!-- Línea 1: Expresión completa que se está calculando -->
                <div class="w-full overflow-x-auto text-right mb-2 pb-1" id="expressionContainer">
                    <div id="expressionDisplay" class="text-md-textSecondary text-lg sm:text-xl font-normal tracking-wide whitespace-nowrap min-h-[28px]">
                        <!-- Expresión dinámica -->
                    </div>
                </div>

                <!-- Línea 2: Resultado total o número actual -->
                <div class="w-full overflow-x-auto text-right flex items-center justify-end gap-2">
                    <div id="resultDisplay" 
                         title="Haz clic para copiar el resultado"
                         class="cursor-pointer text-4xl sm:text-5xl font-normal text-md-textPrimary tracking-tight whitespace-nowrap transition-all duration-150">
                        0
                    </div>
                </div>
            </div>

            <!-- Teclado Numérico y Operadores (Grid 4x5) -->
            <div class="grid grid-cols-4 gap-2.5 sm:gap-3 flex-1">
                
                <!-- Fila 1: AC, Retroceso, Porcentaje (o Limpiar entrada), Dividir -->
                <button data-action="clear" class="md-btn col-span-2 rounded-full bg-md-tertiaryContainer text-md-onTertiaryContainer hover:brightness-110 text-lg sm:text-xl font-medium flex items-center justify-center py-3.5 sm:py-4 shadow-sm">
                    AC
                </button>
                <button data-action="backspace" aria-label="Borrar último dígito" class="md-btn rounded-full bg-md-secondaryContainer text-md-onSecondaryContainer hover:brightness-110 flex items-center justify-center py-3.5 sm:py-4 shadow-sm">
                    <span class="material-symbols-outlined text-2xl">backspace</span>
                </button>
                <button data-operator="÷" class="md-btn rounded-full bg-md-secondaryContainer text-md-primary hover:brightness-110 text-2xl font-medium flex items-center justify-center py-3.5 sm:py-4 shadow-sm">
                    ÷
                </button>

                <!-- Fila 2: 7, 8, 9, Multiplicar -->
                <button data-number="7" class="md-btn rounded-full bg-md-surfaceElevated text-md-textPrimary hover:bg-white/10 text-2xl font-normal flex items-center justify-center py-3.5 sm:py-4">
                    7
                </button>
                <button data-number="8" class="md-btn rounded-full bg-md-surfaceElevated text-md-textPrimary hover:bg-white/10 text-2xl font-normal flex items-center justify-center py-3.5 sm:py-4">
                    8
                </button>
                <button data-number="9" class="md-btn rounded-full bg-md-surfaceElevated text-md-textPrimary hover:bg-white/10 text-2xl font-normal flex items-center justify-center py-3.5 sm:py-4">
                    9
                </button>
                <button data-operator="×" class="md-btn rounded-full bg-md-secondaryContainer text-md-primary hover:brightness-110 text-2xl font-medium flex items-center justify-center py-3.5 sm:py-4 shadow-sm">
                    ×
                </button>

                <!-- Fila 3: 4, 5, 6, Restar -->
                <button data-number="4" class="md-btn rounded-full bg-md-surfaceElevated text-md-textPrimary hover:bg-white/10 text-2xl font-normal flex items-center justify-center py-3.5 sm:py-4">
                    4
                </button>
                <button data-number="5" class="md-btn rounded-full bg-md-surfaceElevated text-md-textPrimary hover:bg-white/10 text-2xl font-normal flex items-center justify-center py-3.5 sm:py-4">
                    5
                </button>
                <button data-number="6" class="md-btn rounded-full bg-md-surfaceElevated text-md-textPrimary hover:bg-white/10 text-2xl font-normal flex items-center justify-center py-3.5 sm:py-4">
                    6
                </button>
                <button data-operator="−" class="md-btn rounded-full bg-md-secondaryContainer text-md-primary hover:brightness-110 text-2xl font-medium flex items-center justify-center py-3.5 sm:py-4 shadow-sm">
                    −
                </button>

                <!-- Fila 4: 1, 2, 3, Sumar -->
                <button data-number="1" class="md-btn rounded-full bg-md-surfaceElevated text-md-textPrimary hover:bg-white/10 text-2xl font-normal flex items-center justify-center py-3.5 sm:py-4">
                    1
                </button>
                <button data-number="2" class="md-btn rounded-full bg-md-surfaceElevated text-md-textPrimary hover:bg-white/10 text-2xl font-normal flex items-center justify-center py-3.5 sm:py-4">
                    2
                </button>
                <button data-number="3" class="md-btn rounded-full bg-md-surfaceElevated text-md-textPrimary hover:bg-white/10 text-2xl font-normal flex items-center justify-center py-3.5 sm:py-4">
                    3
                </button>
                <button data-operator="+" class="md-btn rounded-full bg-md-secondaryContainer text-md-primary hover:brightness-110 text-2xl font-medium flex items-center justify-center py-3.5 sm:py-4 shadow-sm">
                    +
                </button>

                <!-- Fila 5: 0 (ancho doble), Punto decimal, Igual -->
                <button data-number="0" class="md-btn col-span-2 rounded-full bg-md-surfaceElevated text-md-textPrimary hover:bg-white/10 text-2xl font-normal flex items-center justify-center py-3.5 sm:py-4">
                    0
                </button>
                <button data-decimal="." class="md-btn rounded-full bg-md-surfaceElevated text-md-textPrimary hover:bg-white/10 text-2xl font-bold flex items-center justify-center py-3.5 sm:py-4">
                    .
                </button>
                <button data-action="equals" class="md-btn md-btn-primary rounded-full bg-md-primary text-md-onPrimary hover:brightness-105 text-2xl font-medium flex items-center justify-center py-3.5 sm:py-4 shadow-md">
                    =
                </button>

            </div>
        </section>

        <!-- Sección Derecha / Cajón Desplegable: Historial de Cálculos -->
        <aside id="historyPanel" 
               class="history-drawer fixed md:static inset-0 z-30 md:z-auto w-full md:w-80 lg:w-96 bg-md-surfaceVariant md:border-l border-white/5 flex flex-col justify-between p-5 transform translate-y-full md:translate-y-0 opacity-0 md:opacity-100 pointer-events-none md:pointer-events-auto">
            
            <!-- Cabecera del Historial -->
            <div class="flex items-center justify-between pb-3 border-b border-white/10">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-md-primary">history</span>
                    <h2 class="text-base font-medium text-md-textPrimary">Historial</h2>
                </div>
                
                <div class="flex items-center gap-1">
                    <!-- Botón limpiar historial -->
                    <button id="clearHistoryBtn" 
                            title="Borrar todo el historial"
                            class="md-btn p-2 rounded-full text-md-textSecondary hover:text-red-300 hover:bg-white/5 transition-colors hidden">
                        <span class="material-symbols-outlined text-xl">delete_sweep</span>
                    </button>
                    <!-- Botón cerrar en móviles -->
                    <button id="closeHistoryBtn" 
                            aria-label="Cerrar historial"
                            class="md:hidden md-btn p-2 rounded-full text-md-textSecondary hover:text-md-textPrimary hover:bg-white/5">
                        <span class="material-symbols-outlined text-xl">close</span>
                    </button>
                </div>
            </div>

            <!-- Lista de Cálculos -->
            <div id="historyList" class="flex-1 overflow-y-auto my-3 space-y-2.5 pr-1">
                <!-- Estado vacío por defecto -->
                <div id="emptyHistoryState" class="h-full flex flex-col items-center justify-center text-center text-md-textSecondary/60 px-4">
                    <span class="material-symbols-outlined text-4xl mb-2 opacity-50">receipt_long</span>
                    <p class="text-sm">Aún no hay cálculos</p>
                    <p class="text-xs mt-1">Tus operaciones completadas aparecerán aquí para reutilizarlas.</p>
                </div>
            </div>

            <!-- Pie informativo del historial -->
            <div class="pt-2 border-t border-white/5 text-[11px] text-md-textSecondary/70 flex items-center justify-between">
                <span>Clic en un ítem para reutilizar</span>
                <span class="font-mono text-md-primary/80">MD3 Dark</span>
            </div>
        </aside>

    </main>

    <!-- Lógica de la Calculadora -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Referencias del DOM ---
            const expressionDisplay = document.getElementById('expressionDisplay');
            const expressionContainer = document.getElementById('expressionContainer');
            const resultDisplay = document.getElementById('resultDisplay');
            const statusBadge = document.getElementById('statusBadge');
            
            // Historial DOM
            const historyPanel = document.getElementById('historyPanel');
            const toggleHistoryBtn = document.getElementById('toggleHistoryBtn');
            const closeHistoryBtn = document.getElementById('closeHistoryBtn');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const historyList = document.getElementById('historyList');
            const emptyHistoryState = document.getElementById('emptyHistoryState');

            // --- Estado de la Aplicación ---
            // Tokens almacena la frase completa: ej. ['125', '+', '45', '×']
            let tokens = [];
            // Número que se está escribiendo actualmente
            let currentInput = '0';
            // Bandera para saber si se acaba de presionar '='
            let justEvaluated = false;
            // Bandera de error (ej. División por cero)
            let hasError = false;
            // Lista de historial cargada de localStorage si existe
            let history = JSON.parse(localStorage.getItem('md3_calc_history')) || [];

            // --- Inicialización ---
            updateDisplay();
            renderHistory();

            // --- Efecto Ripple Material Design ---
            document.querySelectorAll('.md-btn').forEach(button => {
                button.addEventListener('click', function (e) {
                    const circle = document.createElement('span');
                    const diameter = Math.max(this.clientWidth, this.clientHeight);
                    const radius = diameter / 2;
                    const rect = this.getBoundingClientRect();

                    // Si se disparó por teclado, centrar la onda
                    const clientX = e.clientX || (rect.left + radius);
                    const clientY = e.clientY || (rect.top + radius);

                    circle.style.width = circle.style.height = `${diameter}px`;
                    circle.style.left = `${clientX - rect.left - radius}px`;
                    circle.style.top = `${clientY - rect.top - radius}px`;
                    circle.classList.add('ripple');

                    const existingRipple = this.querySelector('.ripple');
                    if (existingRipple) {
                        existingRipple.remove();
                    }

                    this.appendChild(circle);
                });
            });

            // --- Funciones de Formateo y Pantalla ---
            function formatNumber(numStr) {
                if (numStr === 'Error' || numStr === 'No se puede dividir entre 0') return numStr;
                if (numStr === '' || numStr === '-') return numStr;

                // Separar parte entera y decimal para no perder el punto mientras se escribe
                const parts = numStr.split('.');
                const integerPart = parts[0];
                const decimalPart = parts[1];

                // Formatear con comas de miles solo si es un número válido
                const formattedInt = isNaN(Number(integerPart)) 
                    ? integerPart 
                    : Number(integerPart).toLocaleString('en-US');

                if (parts.length > 1) {
                    return `${formattedInt}.${decimalPart}`;
                }
                return formattedInt;
            }

            function updateDisplay() {
                // 1. Construir la línea superior (Expresión completa)
                let fullExpression = '';
                
                if (justEvaluated) {
                    // Muestra la expresión final seguida de '='
                    fullExpression = tokens.join(' ') + ' =';
                } else {
                    // Muestra los tokens acumulados + el número actual en construcción
                    const displayTokens = [...tokens];
                    if (currentInput !== '') {
                        displayTokens.push(currentInput);
                    }
                    fullExpression = displayTokens.join(' ');
                }

                expressionDisplay.textContent = fullExpression || '\u00A0';

                // 2. Actualizar la línea inferior (Resultado o número actual)
                if (hasError) {
                    resultDisplay.textContent = currentInput;
                    resultDisplay.classList.add('text-red-400', 'text-2xl', 'sm:text-3xl');
                    resultDisplay.classList.remove('text-4xl', 'sm:text-5xl', 'text-md-textPrimary');
                } else {
                    resultDisplay.classList.remove('text-red-400', 'text-2xl', 'sm:text-3xl');
                    resultDisplay.classList.add('text-4xl', 'sm:text-5xl', 'text-md-textPrimary');
                    
                    const valueToShow = currentInput !== '' ? currentInput : (tokens.length > 0 ? tokens[tokens.length - 1] : '0');
                    resultDisplay.textContent = formatNumber(valueToShow);

                    // Ajustar tamaño de fuente dinámicamente si el número es muy largo
                    if (resultDisplay.textContent.length > 13) {
                        resultDisplay.classList.replace('text-4xl', 'text-2xl');
                        resultDisplay.classList.replace('sm:text-5xl', 'sm:text-3xl');
                    }
                }

                // Auto-scroll hacia la derecha en expresiones largas
                expressionContainer.scrollLeft = expressionContainer.scrollWidth;
            }

            // --- Lógica de Operaciones ---
            function inputNumber(digit) {
                if (hasError) {
                    clearAll();
                }

                if (justEvaluated) {
                    // Si acabamos de calcular y presionamos un número, iniciamos nueva operación
                    tokens = [];
                    currentInput = digit;
                    justEvaluated = false;
                } else {
                    if (currentInput === '0') {
                        currentInput = digit;
                    } else if (currentInput.length < 15) { // Límite razonable de dígitos
                        currentInput += digit;
                    }
                }
                updateDisplay();
            }

            function inputDecimal() {
                if (hasError) {
                    clearAll();
                }

                if (justEvaluated) {
                    tokens = [];
                    currentInput = '0.';
                    justEvaluated = false;
                    updateDisplay();
                    return;
                }

                if (currentInput === '') {
                    currentInput = '0.';
                } else if (!currentInput.includes('.')) {
                    // Validación estricta: solo un punto por número
                    currentInput += '.';
                }
                updateDisplay();
            }

            function inputOperator(op) {
                if (hasError) {
                    clearAll();
                }

                if (justEvaluated) {
                    // Continuar operando con el resultado anterior
                    tokens = [currentInput, op];
                    currentInput = '';
                    justEvaluated = false;
                    updateDisplay();
                    return;
                }

                if (currentInput !== '') {
                    // Limpiar punto decimal suelto al final (ej. "5." -> "5")
                    if (currentInput.endsWith('.')) {
                        currentInput = currentInput.slice(0, -1);
                    }
                    tokens.push(currentInput);
                    tokens.push(op);
                    currentInput = '';
                } else if (tokens.length > 0) {
                    // Si el usuario cambia de operador (ej. presionó + y luego ×)
                    const lastToken = tokens[tokens.length - 1];
                    if (['+', '−', '×', '÷'].includes(lastToken)) {
                        tokens[tokens.length - 1] = op;
                    }
                }
                updateDisplay();
            }

            function backspace() {
                if (hasError) {
                    clearAll();
                    return;
                }

                if (justEvaluated) {
                    // Si se presionó '=', backspace limpia la expresión superior y deja el resultado editable
                    tokens = [];
                    justEvaluated = false;
                    updateDisplay();
                    return;
                }

                if (currentInput.length > 0) {
                    currentInput = currentInput.slice(0, -1);
                    if (currentInput === '' && tokens.length === 0) {
                        currentInput = '0';
                    }
                } else if (tokens.length > 0) {
                    // Si currentInput está vacío, eliminar el último operador y recuperar el número anterior
                    tokens.pop(); // Quita el operador
                    if (tokens.length > 0) {
                        currentInput = tokens.pop(); // Recupera el número previo para seguir editándolo
                    } else {
                        currentInput = '0';
                    }
                }
                updateDisplay();
            }

            function clearAll() {
                tokens = [];
                currentInput = '0';
                justEvaluated = false;
                hasError = false;
                updateDisplay();
            }

            // Evaluación matemática con precedencia de operadores (× y ÷ antes que + y −)
            function evaluateExpression() {
                if (hasError || justEvaluated) return;

                let evalTokens = [...tokens];

                if (currentInput !== '') {
                    if (currentInput.endsWith('.')) {
                        currentInput = currentInput.slice(0, -1);
                    }
                    evalTokens.push(currentInput);
                } else if (evalTokens.length > 0) {
                    // Si termina en un operador (ej. "5 + "), quitar el operador colgante
                    const last = evalTokens[evalTokens.length - 1];
                    if (['+', '−', '×', '÷'].includes(last)) {
                        evalTokens.pop();
                    }
                }

                // Si solo hay un número y ningún operador, no es necesario calcular
                if (evalTokens.length < 3) {
                    return;
                }

                try {
                    const result = computePrecedence(evalTokens);
                    
                    if (!isFinite(result) || isNaN(result)) {
                        throw new Error('No se puede dividir entre 0');
                    }

                    // Redondear errores de punto flotante de JS (ej. 0.1 + 0.2 = 0.30000000000000004)
                    const cleanResult = String(Math.round(result * 1e10) / 1e10);
                    const expressionString = evalTokens.join(' ');

                    // Guardar en el historial
                    addToHistory(expressionString, cleanResult);

                    // Actualizar estado
                    tokens = evalTokens;
                    currentInput = cleanResult;
                    justEvaluated = true;
                    updateDisplay();

                } catch (err) {
                    hasError = true;
                    tokens = evalTokens;
                    currentInput = err.message || 'Error';
                    justEvaluated = true;
                    updateDisplay();
                }
            }

            function computePrecedence(tokenArray) {
                // Paso 1: Resolver Multiplicación (×) y División (÷)
                let pass1 = [];
                let i = 0;
                while (i < tokenArray.length) {
                    const token = tokenArray[i];
                    if (token === '×' || token === '÷') {
                        const prev = parseFloat(pass1.pop());
                        const next = parseFloat(tokenArray[i + 1]);
                        if (token === '÷' && next === 0) {
                            throw new Error('No se puede dividir entre 0');
                        }
                        const res = token === '×' ? prev * next : prev / next;
                        pass1.push(res);
                        i += 2;
                    } else {
                        pass1.push(token);
                        i++;
                    }
                }

                // Paso 2: Resolver Suma (+) y Resta (−)
                let finalResult = parseFloat(pass1[0]);
                for (let j = 1; j < pass1.length; j += 2) {
                    const operator = pass1[j];
                    const nextVal = parseFloat(pass1[j + 1]);
                    if (operator === '+') {
                        finalResult += nextVal;
                    } else if (operator === '−') {
                        finalResult -= nextVal;
                    }
                }
                return finalResult;
            }

            // --- Gestión del Historial ---
            function addToHistory(expression, result) {
                const entry = {
                    id: Date.now(),
                    expression,
                    result
                };
                history.unshift(entry); // Agregar al inicio
                if (history.length > 50) history.pop(); // Máximo 50 registros
                localStorage.setItem('md3_calc_history', JSON.stringify(history));
                renderHistory();
            }

            function renderHistory() {
                // Limpiar lista actual excepto el estado vacío
                Array.from(historyList.children).forEach(child => {
                    if (child.id !== 'emptyHistoryState') {
                        child.remove();
                    }
                });

                if (history.length === 0) {
                    emptyHistoryState.classList.remove('hidden');
                    clearHistoryBtn.classList.add('hidden');
                    return;
                }

                emptyHistoryState.classList.add('hidden');
                clearHistoryBtn.classList.remove('hidden');

                history.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'p-3.5 rounded-2xl bg-md-surfaceElevated/80 hover:bg-white/10 border border-white/5 cursor-pointer transition-all group flex flex-col items-end';
                    card.innerHTML = `
                        <div class="text-xs text-md-textSecondary group-hover:text-md-textPrimary transition-colors mb-1 text-right break-all">
                            ${item.expression} =
                        </div>
                        <div class="text-xl font-medium text-md-primary">
                            ${formatNumber(item.result)}
                        </div>
                    `;

                    // Al hacer clic, reutilizar el resultado en la calculadora
                    card.addEventListener('click', () => {
                        hasError = false;
                        if (justEvaluated || (tokens.length === 0 && currentInput === '0')) {
                            tokens = [];
                            currentInput = item.result;
                            justEvaluated = false;
                        } else {
                            // Si hay un operador esperando un número (ej. "50 + "), insertarlo ahí
                            currentInput = item.result;
                        }
                        updateDisplay();
                        closeMobileHistory();
                    });

                    historyList.appendChild(card);
                });
            }

            clearHistoryBtn.addEventListener('click', () => {
                history = [];
                localStorage.removeItem('md3_calc_history');
                renderHistory();
            });

            // --- Drawer de Historial en Móviles ---
            function openMobileHistory() {
                historyPanel.classList.remove('translate-y-full', 'opacity-0', 'pointer-events-none');
                historyPanel.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
            }

            function closeMobileHistory() {
                historyPanel.classList.add('translate-y-full', 'opacity-0', 'pointer-events-none');
                historyPanel.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
            }

            toggleHistoryBtn.addEventListener('click', openMobileHistory);
            closeHistoryBtn.addEventListener('click', closeMobileHistory);

            // --- Copiar resultado al hacer clic ---
            resultDisplay.addEventListener('click', () => {
                if (hasError) return;
                const rawVal = currentInput !== '' ? currentInput : '0';
                
                // Fallback seguro para iframe usando textarea temporal
                const textArea = document.createElement("textarea");
                textArea.value = rawVal;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    statusBadge.classList.remove('opacity-0');
                    setTimeout(() => statusBadge.classList.add('opacity-0'), 1500);
                } catch (err) {
                    console.error('Error al copiar:', err);
                }
                document.body.removeChild(textArea);
            });

            // --- Eventos de Clic en Botones ---
            document.querySelectorAll('[data-number]').forEach(btn => {
                btn.addEventListener('click', () => inputNumber(btn.dataset.number));
            });

            document.querySelectorAll('[data-operator]').forEach(btn => {
                btn.addEventListener('click', () => inputOperator(btn.dataset.operator));
            });

            document.querySelector('[data-decimal]').addEventListener('click', inputDecimal);
            document.querySelector('[data-action="clear"]').addEventListener('click', clearAll);
            document.querySelector('[data-action="backspace"]').addEventListener('click', backspace);
            document.querySelector('[data-action="equals"]').addEventListener('click', evaluateExpression);

            // --- Soporte de Teclado Físico ---
            document.addEventListener('keydown', (e) => {
                const key = e.key;

                // Números 0-9
                if (/^[0-9]$/.test(key)) {
                    e.preventDefault();
                    triggerButtonVisual(`[data-number="${key}"]`);
                    inputNumber(key);
                }
                // Punto decimal
                else if (key === '.' || key === ',') {
                    e.preventDefault();
                    triggerButtonVisual('[data-decimal]');
                    inputDecimal();
                }
                // Operadores
                else if (key === '+') {
                    e.preventDefault();
                    triggerButtonVisual('[data-operator="+"]');
                    inputOperator('+');
                }
                else if (key === '-') {
                    e.preventDefault();
                    triggerButtonVisual('[data-operator="−"]');
                    inputOperator('−');
                }
                else if (key === '*' || key.toLowerCase() === 'x') {
                    e.preventDefault();
                    triggerButtonVisual('[data-operator="×"]');
                    inputOperator('×');
                }
                else if (key === '/') {
                    e.preventDefault();
                    triggerButtonVisual('[data-operator="÷"]');
                    inputOperator('÷');
                }
                // Igual / Enter
                else if (key === 'Enter' || key === '=') {
                    e.preventDefault();
                    triggerButtonVisual('[data-action="equals"]');
                    evaluateExpression();
                }
                // Retroceso
                else if (key === 'Backspace') {
                    e.preventDefault();
                    triggerButtonVisual('[data-action="backspace"]');
                    backspace();
                }
                // Borrar todo (Escape o Delete)
                else if (key === 'Escape' || key === 'Delete') {
                    e.preventDefault();
                    triggerButtonVisual('[data-action="clear"]');
                    clearAll();
                }
            });

            // Simula el efecto visual de pulsación al usar el teclado físico
            function triggerButtonVisual(selector) {
                const btn = document.querySelector(selector);
                if (btn) {
                    btn.classList.add('brightness-125', 'scale-95');
                    setTimeout(() => {
                        btn.classList.remove('brightness-125', 'scale-95');
                    }, 120);
                }
            }
        });
    </script>
</body>
</html>
